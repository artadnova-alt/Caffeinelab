<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Caffeine Lab | Menu</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Vazirmatn:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --brand-green: #a98e57;
            --brand-dark-green: #0a1f18;
            --brand-green-glow: rgba(169, 142, 87, 0.4);
            --bg-deep: #05120e;
            --card-bg: rgba(14, 38, 30, 0.95);
            --accent-gold: #e2c070;
            --text-main: #f4f7ee;
            --text-sub: #a3b3a7;
            --border-glow: rgba(169, 142, 87, 0.3);
            --radius-xl: 24px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 10px;
            z-index: 10;
        }

        header h1 {
            font-family: 'Cinzel', serif;
            font-size: 18px;
            color: var(--accent-gold);
            letter-spacing: 2px;
        }

        header p {
            font-size: 11px;
            color: var(--text-sub);
            margin-top: 4px;
        }

        /* نوار ابزار قابلیت‌های جدید */
        .features-bar {
            display: flex;
            gap: 10px;
            margin: 10px 0 20px 0;
            flex-wrap: wrap;
            justify-content: center;
            z-index: 10;
        }

        .lucky-btn, .assistant-btn {
            background: linear-gradient(135deg, var(--brand-green), #8a7243);
            color: var(--bg-deep);
            border: none;
            padding: 9px 18px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 15px var(--brand-green-glow);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .lucky-btn:hover, .assistant-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--brand-green);
        }

        /* فیلترهای رژیمی */
        .diet-filters {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            overflow-x: auto;
            max-width: 100%;
            padding-bottom: 5px;
        }

        .diet-chip {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            color: var(--text-sub);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 10px;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.3s;
        }

        .diet-chip.active, .diet-chip:hover {
            background: var(--brand-green);
            color: var(--bg-deep);
            border-color: var(--brand-green);
            font-weight: 700;
        }

        .orbit-wrapper {
            position: relative;
            width: 360px;
            height: 360px;
            margin: 5px auto 20px auto;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
        }

        .orbit-wrapper:active { cursor: grabbing; }

        .orbit-ring {
            position: absolute;
            width: 360px;
            height: 360px;
            border: 1px dashed rgba(169, 142, 87, 0.4);
            border-radius: 50%;
            transition: transform 1.2s cubic-bezier(0.15, 0.85, 0.35, 1);
            pointer-events: none;
        }

        .center-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 110px;
            height: 110px;
            background: rgba(10, 31, 24, 0.98);
            border: 2px solid var(--brand-green);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px var(--brand-green-glow);
            z-index: 5;
            text-align: center;
            padding: 10px;
            pointer-events: none;
        }

        .center-logo i { color: var(--accent-gold); font-size: 16px; margin-bottom: 4px; }
        .center-logo .logo-name-ar { font-size: 11px; font-weight: 700; color: var(--text-main); line-height: 1.2; }
        .center-logo .logo-name-en { font-family: 'Cinzel', serif; font-size: 9px; color: var(--accent-gold); letter-spacing: 1px; margin-top: 2px; }

        .orbit-item {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 65px;
            height: 65px;
            margin: -32.5px 0 0 -32.5px;
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            z-index: 4;
            pointer-events: auto;
        }

        .orbit-item:hover, .orbit-item.active {
            border-color: var(--brand-green);
            background: var(--brand-green);
            color: var(--bg-deep);
            box-shadow: 0 0 20px var(--brand-green);
        }

        .orbit-ring.spinning .orbit-item {
            background: var(--card-bg) !important;
            border-color: var(--border-glow) !important;
            color: var(--text-main) !important;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5) !important;
        }
        .orbit-ring.spinning .orbit-item i { color: var(--brand-green) !important; }

        .orbit-item i { font-size: 16px; color: var(--brand-green); transition: color 0.3s; }
        .orbit-item:hover i, .orbit-item.active i { color: var(--bg-deep); }
        .orbit-item span {
            font-size: 8px;
            font-weight: 700;
            margin-top: 2px;
            white-space: nowrap;
            max-width: 55px;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
        }

        .submenu-panel {
            width: 100%;
            max-width: 550px;
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: var(--radius-xl);
            padding: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            backdrop-filter: blur(15px);
            margin-bottom: 40px;
            animation: fadeIn 0.4s ease;
        }

        .panel-header {
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px dashed rgba(169, 142, 87, 0.3);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .panel-icon {
            width: 40px;
            height: 40px;
            background: var(--brand-green);
            color: var(--bg-deep);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .panel-title h3 { font-size: 16px; font-weight: 700; }
        .panel-title span { font-family: 'Cinzel', serif; font-size: 10px; color: var(--accent-gold); }

        .dish-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            transition: background 0.2s;
        }

        .dish-row:hover { background: rgba(169, 142, 87, 0.05); border-radius: 10px; }
        .dish-row:last-child { border-bottom: none; }

        .dish-info h4 { font-size: 13px; font-weight: 600; }
        .dish-info p { font-size: 10px; color: var(--text-sub); margin-top: 2px; }

        /* استایل مقیاس کافئین */
        .caffeine-meter {
            display: flex;
            gap: 3px;
            align-items: center;
        }
        .caffeine-meter i {
            font-size: 9px;
            color: var(--brand-green);
        }
        .caffeine-meter i.inactive {
            color: rgba(255,255,255,0.15);
        }

        /* مدال دستیار انتخاب هوشمند */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--brand-green);
            border-radius: var(--radius-xl);
            padding: 25px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 30px var(--brand-green-glow);
        }
        .modal-content h3 { color: var(--accent-gold); margin-bottom: 15px; font-size: 16px; }
        .modal-options { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .modal-opt-btn {
            background: rgba(169, 142, 87, 0.1);
            border: 1px solid var(--border-glow);
            color: var(--text-main);
            padding: 10px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.3s;
        }
        .modal-opt-btn:hover { background: var(--brand-green); color: var(--bg-deep); }
        .close-modal { margin-top: 15px; background: none; border: none; color: var(--text-sub); cursor: pointer; font-size: 11px; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

        let currentRotation = 0;
        let isDragging = false;
        let startAngle = 0;
        let lastRandomIndex = -1;
        let activeCategoryIndex = 0;

        const orbitRing = document.getElementById('orbitRing');
        const orbitWrapper = document.getElementById('orbitWrapper');
        const radius = 130;
        const targetAngleDeg = 140;

        function initOrbit() {
            orbitRing.innerHTML = '';
            const total = MENU_DATA.length;

            MENU_DATA.forEach((cat, index) => {
                const angle = (index / total) * 2 * Math.PI;
                const x = radius * Math.cos(angle);
                const y = radius * Math.sin(angle);

                const item = document.createElement('div');
                item.className = `orbit-item ${index === 0 ? 'active' : ''}`;
                item.style.transform = `translate(${x}px, ${y}px)`;
                item.innerHTML = `<i class="fa-solid ${cat.icon}"></i><span>${cat.titleAr}</span>`;
                
                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectCategory(index);
                });

                orbitRing.appendChild(item);
            });

            updatePanel(0);
        }

        function selectCategory(index) {
            activeCategoryIndex = index;
            const items = orbitRing.querySelectorAll('.orbit-item');
            items.forEach((el, i) => {
                if(i === index) el.classList.add('active');
                else el.classList.remove('active');
            });
            updatePanel(index);
        }

        function updatePanel(index, filteredItems = null) {
            const cat = MENU_DATA[index];
            document.getElementById('panelIcon').innerHTML = `<i class="fa-solid ${cat.icon}"></i>`;
            document.getElementById('panelTitleAr').innerText = cat.titleAr;
            document.getElementById('panelTitleEn').innerText = cat.titleEn;

            const itemsToRender = filteredItems || cat.items;
            const container = document.getElementById('panelItems');
            
            if(itemsToRender.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:20px; font-size:11px; color:var(--text-sub);">لا توجد عناصر مطابقة لهذا الفلتر في هذا القسم</div>`;
                return;
            }

            container.innerHTML = itemsToRender.map(d => {
                // ساخت مقیاس کافئین (دانه قهوه)
                let caffeineHTML = '';
                if(d.caffeine > 0) {
                    caffeineHTML = `<div class="caffeine-meter" title="مستوى الكافيين">`;
                    for(let i=1; i<=3; i++) {
                        caffeineHTML += `<i class="fa-solid fa-mug-hot ${i <= d.caffeine ? '' : 'inactive'}"></i>`;
                    }
                    caffeineHTML += `</div>`;
                }

                return `
                    <div class="dish-row">
                        <div class="dish-info">
                            <h4>${d.ar}</h4>
                            <p>${d.en}</p>
                        </div>
                        ${caffeineHTML}
                    </div>
                `;
            }).join('');
        }

        // فیلتر رژیمی
        function filterDiet(type, chipElement) {
            document.querySelectorAll('.diet-chip').forEach(c => c.classList.remove('active'));
            chipElement.classList.add('active');

            const cat = MENU_DATA[activeCategoryIndex];
            if(type === 'all') {
                updatePanel(activeCategoryIndex);
            } else if(type === 'keto') {
                const filtered = cat.items.filter(item => item.type === 'keto' || item.ar.includes('كيتو') || item.ar.includes('كيتوني'));
                updatePanel(activeCategoryIndex, filtered);
            } else if(type === 'caffeine') {
                const filtered = cat.items.filter(item => item.caffeine >= 3);
                updatePanel(activeCategoryIndex, filtered);
            } else if(type === 'sweet') {
                const filtered = cat.items.filter(item => item.type === 'sweet');
                updatePanel(activeCategoryIndex, filtered);
            }
        }

        // چرخش عجله شانس
        function spinLuckyMenu() {
            const total = MENU_DATA.length;
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * total);
            } while (randomIndex === lastRandomIndex && total > 1);
            
            lastRandomIndex = randomIndex;

            orbitRing.classList.add('spinning');
            const items = orbitRing.querySelectorAll('.orbit-item');
            items.forEach(el => el.classList.remove('active'));

            const anglePerItem = 360 / total;
            const itemBaseAngle = randomIndex * anglePerItem;
            const spins = 4 * 360;
            const targetMod = (targetAngleDeg - itemBaseAngle) % 360;
            const currentMod = currentRotation % 360;
            
            let diff = targetMod - currentMod;
            if (diff < 0) diff += 360;

            currentRotation += spins + diff;
            orbitRing.style.transform = `rotate(${currentRotation}deg)`;

            items.forEach((el, i) => {
                const angle = (i / total) * 2 * Math.PI;
                const x = radius * Math.cos(angle);
                const y = radius * Math.sin(angle);
                el.style.transform = `translate(${x}px, ${y}px) rotate(${-currentRotation}deg)`;
            });

            setTimeout(() => {
                orbitRing.classList.remove('spinning');
                selectCategory(randomIndex);
            }, 1200);
        }

        // کنترل‌های دستیار هوشمند
        function openAssistant() { document.getElementById('assistantModal').style.display = 'flex'; }
        function closeAssistant() { document.getElementById('assistantModal').style.display = 'none'; }
        
        function recommendByMood(moodType) {
            closeAssistant();
            // یافتن تصادفی یک آیتم مرتبط با حس و حال کاربر
            let matchingItems = [];
            MENU_DATA.forEach(cat => {
                cat.items.forEach(item => {
                    if(item.type === moodType) matchingItems.push({catTitle: cat.titleAr, ...item});
                });
            });

            if(matchingItems.length > 0) {
                const chosen = matchingItems[Math.floor(Math.random() * matchingItems.length)];
                alert(`✨ اقتراح مساعد الذوق لك:\n\n☕ ${chosen.ar} (${chosen.en})\n📁 القسم: ${chosen.catTitle}`);
            }
        }

        orbitWrapper.addEventListener('pointerdown', (e) => {
            isDragging = true;
            const rect = orbitWrapper.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            startAngle = Math.atan2(e.clientY - cy, e.clientX - cx) * (180 / Math.PI) - currentRotation;
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const rect = orbitWrapper.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const angle = Math.atan2(e.clientY - cy, e.clientX - cx) * (180 / Math.PI);
            currentRotation = angle - startAngle;
            orbitRing.style.transform = `rotate(${currentRotation}deg)`;

            const total = MENU_DATA.length;
            const items = orbitRing.querySelectorAll('.orbit-item');
            items.forEach((el, i) => {
                const angle = (i / total) * 2 * Math.PI;
                const x = radius * Math.cos(angle);
                const y = radius * Math.sin(angle);
                el.style.transform = `translate(${x}px, ${y}px) rotate(${-currentRotation}deg)`;
            });
        });

        window.addEventListener('pointerup', () => { isDragging = false; });
        window.addEventListener('load', initOrbit);
    </script>
</body>
</html>
