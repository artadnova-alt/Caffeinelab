<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Caffeine Lab | Menu</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Vazirmatn:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --brand-green: #a98e57;
            --brand-dark-green: #0a1f18;
            --brand-green-glow: rgba(169, 142, 87, 0.4);
            --bg-deep: #05120e;
            --card-bg: rgba(14, 38, 30, 0.95);
            --accent-gold: #e2c070;
            --text-main: #f4f7ee;
            --text-sub: #a3b3a7;
            --border-glow: rgba(169, 142, 87, 0.3);
            --radius-xl: 24px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 10px;
            z-index: 10;
        }

        header h1 {
            font-family: 'Cinzel', serif;
            font-size: 18px;
            color: var(--accent-gold);
            letter-spacing: 2px;
        }

        header p {
            font-size: 11px;
            color: var(--text-sub);
            margin-top: 4px;
        }

        .lucky-btn {
            background: linear-gradient(135deg, var(--brand-green), #8a7243);
            color: var(--bg-deep);
            border: none;
            padding: 10px 22px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 20px var(--brand-green-glow);
            transition: all 0.3s ease;
            margin: 10px 0 25px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .lucky-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px var(--brand-green);
        }

        .orbit-wrapper {
            position: relative;
            width: 360px;
            height: 360px;
            margin: 10px auto 25px auto;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
        }

        .orbit-wrapper:active {
            cursor: grabbing;
        }

        .orbit-ring {
            position: absolute;
            width: 360px;
            height: 360px;
            border: 1px dashed rgba(169, 142, 87, 0.4);
            border-radius: 50%;
            transition: transform 1.2s cubic-bezier(0.15, 0.85, 0.35, 1);
            pointer-events: none;
        }

        .center-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 110px;
            height: 110px;
            background: #a98e57;
            border: 2px solid var(--brand-green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px var(--brand-green-glow);
            z-index: 5;
            overflow: hidden;
            pointer-events: none;
        }

        .center-logo svg {
            width: 115%;
            height: 115%;
        }

        .orbit-item {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 65px;
            height: 65px;
            margin: -32.5px 0 0 -32.5px;
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            z-index: 4;
            pointer-events: auto;
        }

        .orbit-item:hover, .orbit-item.active {
            border-color: var(--brand-green);
            background: var(--brand-green);
            color: var(--bg-deep);
            box-shadow: 0 0 20px var(--brand-green);
        }

        .orbit-ring.spinning .orbit-item {
            background: var(--card-bg) !important;
            border-color: var(--border-glow) !important;
            color: var(--text-main) !important;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5) !important;
        }
        .orbit-ring.spinning .orbit-item i {
            color: var(--brand-green) !important;
        }

        .orbit-item i {
            font-size: 16px;
            color: var(--brand-green);
            transition: color 0.3s;
        }

        .orbit-item:hover i, .orbit-item.active i {
            color: var(--bg-deep);
        }

        .orbit-item span {
            font-size: 8px;
            font-weight: 700;
            margin-top: 2px;
            white-space: nowrap;
            max-width: 55px;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
        }

        .submenu-panel {
            width: 100%;
            max-width: 550px;
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: var(--radius-xl);
            padding: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            backdrop-filter: blur(15px);
            margin-bottom: 40px;
            animation: fadeIn 0.4s ease;
        }

        .panel-header {
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px dashed rgba(169, 142, 87, 0.3);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .panel-icon {
            width: 40px;
            height: 40px;
            background: var(--brand-green);
            color: var(--bg-deep);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .panel-title h3 {
            font-size: 16px;
            font-weight: 700;
        }

        .panel-title span {
            font-family: 'Cinzel', serif;
            font-size: 10px;
            color: var(--accent-gold);
        }

        .dish-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            transition: background 0.2s;
        }

        .dish-row:hover {
            background: rgba(169, 142, 87, 0.05);
            border-radius: 10px;
        }

        .dish-row:last-child {
            border-bottom: none;
        }

        .dish-info h4 {
            font-size: 13px;
            font-weight: 600;
        }

        .dish-info p {
            font-size: 10px;
            color: var(--text-sub);
            margin-top: 2px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

        <h1>CAFFEINE LAB</h1>
        <p>انقر على الخيارات أو اسحب الدائرة بيدك لعرض القائمة</p>
    </header>

        <i class="fa-solid fa-dice"></i> إذا كنت محتاراً، اختر عشوائياً!
    </button>

        let currentRotation = 0;
        let isDragging = false;
        let startAngle = 0;
        let lastRandomIndex = -1;

        const orbitRing = document.getElementById('orbitRing');
        const orbitWrapper = document.getElementById('orbitWrapper');
        const radius = 130;
        const targetAngleDeg = 140;

        function initOrbit() {
            orbitRing.innerHTML = '';
            const total = MENU_DATA.length;

            MENU_DATA.forEach((cat, index) => {
                const angle = (index / total) * 2 * Math.PI;
                const x = radius * Math.cos(angle);
                const y = radius * Math.sin(angle);

                const item = document.createElement('div');
                item.className = `orbit-item ${index === 0 ? 'active' : ''}`;
                item.style.transform = `translate(${x}px, ${y}px)`;
                item.innerHTML = `<i class="fa-solid ${cat.icon}"></i><span>${cat.titleAr}</span>`;
                
                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectCategory(index);
                });

                orbitRing.appendChild(item);
            });

            updatePanel(0);
        }

        function selectCategory(index) {
            const items = orbitRing.querySelectorAll('.orbit-item');
            items.forEach((el, i) => {
                if(i === index) el.classList.add('active');
                else el.classList.remove('active');
            });
            updatePanel(index);
        }

        function updatePanel(index) {
            const cat = MENU_DATA[index];
            document.getElementById('panelIcon').innerHTML = `<i class="fa-solid ${cat.icon}"></i>`;
            document.getElementById('panelTitleAr').innerText = cat.titleAr;
            document.getElementById('panelTitleEn').innerText = cat.titleEn;

            const container = document.getElementById('panelItems');
            container.innerHTML = cat.items.map(d => `
                <div class="dish-row">
                    <div class="dish-info">
                        <h4>${d.ar}</h4>
                        <p>${d.en}</p>
                    </div>
                </div>
            `).join('');
        }

        orbitWrapper.addEventListener('pointerdown', (e) => {
            isDragging = true;
            const rect = orbitWrapper.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            startAngle = Math.atan2(e.clientY - cy, e.clientX - cx) * (180 / Math.PI) - currentRotation;
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const rect = orbitWrapper.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const angle = Math.atan2(e.clientY - cy, e.clientX - cx) * (180 / Math.PI);
            currentRotation = angle - startAngle;
            orbitRing.style.transform = `rotate(${currentRotation}deg)`;

            const total = MENU_DATA.length;
            const items = orbitRing.querySelectorAll('.orbit-item');
            items.forEach((el, i) => {
                const angle = (i / total) * 2 * Math.PI;
                const x = radius * Math.cos(angle);
                const y = radius * Math.sin(angle);
                el.style.transform = `translate(${x}px, ${y}px) rotate(${-currentRotation}deg)`;
            });
        });

        window.addEventListener('pointerup', () => {
            isDragging = false;
        });

        function spinLuckyMenu() {
            const total = MENU_DATA.length;
            let randomIndex;
            
            do {
                randomIndex = Math.floor(Math.random() * total);
            } while (randomIndex === lastRandomIndex && total > 1);
            
            lastRandomIndex = randomIndex;

            orbitRing.classList.add('spinning');
            const items = orbitRing.querySelectorAll('.orbit-item');
            items.forEach(el => el.classList.remove('active'));

            const anglePerItem = 360 / total;
            const itemBaseAngle = randomIndex * anglePerItem;
            
            const spins = 4 * 360;
            const targetMod = (targetAngleDeg - itemBaseAngle) % 360;
            const currentMod = currentRotation % 360;
            
            let diff = targetMod - currentMod;
            if (diff < 0) diff += 360;

            currentRotation += spins + diff;

            orbitRing.style.transform = `rotate(${currentRotation}deg)`;

            items.forEach((el, i) => {
                const angle = (i / total) * 2 * Math.PI;
                const x = radius * Math.cos(angle);
                const y = radius * Math.sin(angle);
                el.style.transform = `translate(${x}px, ${y}px) rotate(${-currentRotation}deg)`;
            });

            setTimeout(() => {
                orbitRing.classList.remove('spinning');
                selectCategory(randomIndex);
            }, 1200);
        }

        window.addEventListener('load', initOrbit);
    </script>
</body>
</html>
